[project]
name = "ringLight3"
version = "0.1.0"
description = "Flet GUI to control a WRGB NeoPixel ring over serial"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "JK", email = "jk@jhu.edu" },
]
dependencies = [
  "flet[all]>=0.80,<1",
  "pyserial>=3.5",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.flet]
product = "RingLight Control"
artifact = "ringLight3"
company = "JK"
org = "edu.jhu"
copyright = "Copyright (C) 2026 JK"
build_number = 1
exclude = [
  ".venv/**",
  ".git/**",
  "build/**",
  "dist/**",
  "tests/**",
  "prompt.txt",
  "*.md",
]

[tool.flet.app]
module = "main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "hardware: requires a connected Arduino running ringLight.ino",
]

[tool.flet.windows]
artifact = "RingLight.exe"
